server_name: nats-limited
port: 4222
http: 8222
max_subscriptions: 50

jetstream {
  store_dir: /data
}

accounts {
  CAPPED {
    limits {
      max_conn: 5
    }
    jetstream {
      max_streams: 5
      max_consumers: 50
      max_mem: 0
      max_file: 2684354560
      max_bytes_required: true
    }
    users: [{ user: capped, password: capped }]
  }
}
