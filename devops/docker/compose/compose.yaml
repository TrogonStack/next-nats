name: next-nats

services:
  nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    restart: unless-stopped

  nats-limited:
    profiles: ["limits"]
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats-limited.conf"]
    volumes:
      - ./nats-limited.conf:/etc/nats/nats-limited.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    profiles: ["redis"]
    image: redis:8.2.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  srh:
    profiles: ["redis"]
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:-parity-token}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  nats-data:
