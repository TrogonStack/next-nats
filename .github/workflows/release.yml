name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @trogonstack/next-nats build
      - run: |
          cp LICENSE packages/next-nats/LICENSE
          sed -e "s#](\./#](https://github.com/${GITHUB_REPOSITORY}/blob/main/#g" \
            -e "s#src=\"assets/#src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/#g" \
            README.md > packages/next-nats/README.md
      - run: npm publish
        working-directory: packages/next-nats
